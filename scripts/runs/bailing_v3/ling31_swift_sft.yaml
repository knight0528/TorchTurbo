engine_config:
  parallel_plan:
    sp_size: 2
    ep_size: 8

  activation_checkpointing:
    enabled: true
    use_reentrant: true

  backend_config:
    reshard_after_forward: true
    forward_prefetch_depth: 1
    backward_prefetch_depth: 1
    cpu_offload:
      enabled: true
      mode: full

  moe:
    z_loss_coeff: 0.0000029

  loss_chunk:
    enabled: true

  mfu:
    enabled: true

  mtp:
    enabled: false
    loss_scaling_factor: 0.1
